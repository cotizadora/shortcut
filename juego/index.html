<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego educativo para repasar animales vertebrados e invertebrados, con voz, dibujos y evaluación. Hecho para Antonela.">
<meta name="theme-color" content="#BEE7FB">
<title>Vertebrados e Invertebrados con Antonela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;900&display=swap">
<style>
:root{
  --cielo:#BEE7FB; --cielo2:#EAF7FF; --pasto:#A9DE90; --pasto2:#79C75B;
  --crema:#FFFBF2; --papel:#FFF3DC; --tinta:#2A2118; --tinta-suave:#6B5B4A;
  --sol:#FFC53D; --coral:#FF6B4A; --azul:#2F7FD4; --azul-hondo:#1B4F86;
  --uva:#8E5BD8; --verde:#1E9E63; --rojo:#E04B4B;
  --borde:#2A2118;
  --sombra:0 10px 0 rgba(42,33,24,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--tinta); background:var(--cielo2);
  background-image:linear-gradient(180deg,var(--cielo) 0%,var(--cielo2) 52%,var(--pasto) 52%,var(--pasto2) 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
h1,h2,h3,.btn,.marca{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}

/* ---------- estructura de pantallas ---------- */
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
.pantalla{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));gap:10px
}
.pantalla.activa{display:flex;animation:entra .35s ease-out both}
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.marco{
  width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;
  background:var(--crema);border:4px solid var(--borde);border-radius:30px;
  box-shadow:0 14px 0 rgba(42,33,24,.18);padding:14px;overflow:hidden
}

/* ---------- escenario del dibujo ---------- */
.escena{
  position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--papel);border:3px dashed #E4C89A;border-radius:22px;padding:8px;cursor:pointer
}
.escena svg{height:100%;width:auto;max-height:230px;max-width:100%;display:block;filter:drop-shadow(0 6px 0 rgba(42,33,24,.12))}
.escena.mini svg{max-height:120px}
.escena .grande{max-height:200px}
.oreja{position:absolute;right:10px;bottom:8px;font-size:20px;opacity:.55}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.flota{animation:flota 3.2s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- textos ---------- */
.titulo{font-size:clamp(26px,7vw,40px);line-height:1.05;margin:0;text-align:center;text-wrap:balance;color:var(--azul-hondo)}
.titulo em{font-style:normal;color:var(--coral)}
.nombre{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(24px,6.5vw,34px);text-align:center;margin:0;line-height:1.1}
.dato{font-size:clamp(15px,4vw,18px);font-weight:700;text-align:center;margin:0;color:var(--tinta-suave);line-height:1.35;max-width:44ch;align-self:center}
.chapa{
  align-self:center;display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
  border:3px solid var(--borde);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(14px,3.8vw,17px);
  text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--azul)
}
.chapa.inv{background:var(--coral)}

/* ---------- botones ---------- */
.btn{
  appearance:none;flex-wrap:wrap;text-align:center;line-height:1.1;border:4px solid var(--borde);border-radius:24px;background:var(--sol);color:var(--tinta);
  font-size:clamp(20px,5.5vw,26px);padding:16px 18px;min-height:74px;width:100%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--sombra);
  transition:transform .08s ease,box-shadow .08s ease
}
.btn:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(42,33,24,.16)}
.btn:focus-visible{outline:5px solid var(--uva);outline-offset:4px}
.btn.azul{background:var(--azul);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.verde{background:var(--verde);color:#fff}
.btn.crema{background:#fff}
.btn svg{height:44px;width:44px;flex:0 0 auto}
.btn .sub{display:block;font-family:"Nunito";font-weight:700;font-size:13px;opacity:.85}
.opciones{display:flex;flex-direction:column;gap:10px}
.opciones.dos{flex-direction:row}
.opciones.dos .btn{flex-direction:column;gap:4px;min-height:120px;font-size:clamp(15px,4.4vw,20px);line-height:1.1;padding:10px}
.opciones.dos .btn svg{height:52px;width:52px}
.opciones.tres .btn{min-height:66px;font-size:clamp(17px,4.6vw,21px);justify-content:flex-start;padding:8px 16px}
.opciones.tres .btn svg{height:48px;width:48px}
.btn.bien{background:var(--verde);color:#fff;animation:tiembla-si .4s}
.btn.mal{background:var(--rojo);color:#fff;animation:tiembla-no .4s}
.btn[disabled]{cursor:default}
.btn.apagado{opacity:.35}
@keyframes tiembla-si{0%,100%{transform:none}50%{transform:scale(1.06)}}
@keyframes tiembla-no{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- barra superior ---------- */
.barra{display:flex;align-items:center;gap:8px;min-height:44px}
.icono{
  appearance:none;border:3px solid var(--borde);background:#fff;border-radius:16px;width:46px;height:46px;
  font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(42,33,24,.16);flex:0 0 auto
}
.icono:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,33,24,.16)}
.icono:focus-visible{outline:4px solid var(--uva);outline-offset:3px}
.pasos{flex:1;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
.punto{width:12px;height:12px;border-radius:50%;background:#E3D5BC;border:2px solid rgba(42,33,24,.25)}
.punto.hecho{background:var(--azul)}
.punto.ahora{background:var(--sol);transform:scale(1.45)}
.estrellitas{flex:1;display:flex;gap:4px;justify-content:center;font-size:20px;line-height:1;flex-wrap:wrap}
.estrellitas span{filter:grayscale(1);opacity:.35}
.estrellitas span.on{filter:none;opacity:1;animation:pop .4s both}
.estrellitas span.off{filter:none;opacity:.9}

/* ---------- inicio ---------- */
.portada{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.cinta{
  background:var(--crema);border:4px solid var(--borde);border-radius:28px;padding:16px 20px;text-align:center;
  box-shadow:0 12px 0 rgba(42,33,24,.18);width:100%
}
.cinta p{margin:6px 0 0;font-weight:700;color:var(--tinta-suave);font-size:16px}
.desfile{display:flex;justify-content:center;gap:2px;width:100%;overflow:hidden}
.desfile svg{height:clamp(62px,17vw,96px);width:auto}
.desfile .d2{animation-delay:.4s}.desfile .d3{animation-delay:.8s}.desfile .d4{animation-delay:1.2s}
.firma{font-size:13px;font-weight:700;color:#3b5a3b;text-align:center;margin:0}
.tablero{display:flex;gap:10px;width:100%}
.tablero .btn{flex:1 1 0;min-width:0}
.portada .tablero{flex-direction:column}
.portada .tablero .btn{min-height:88px}

/* ---------- resultado ---------- */
.diploma{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.marcador{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(44px,14vw,74px);line-height:1;color:var(--azul-hondo)}
.marcador small{font-size:.42em;color:var(--tinta-suave)}
.estrellas-fin{font-size:clamp(30px,9vw,46px);letter-spacing:4px;line-height:1}
.repaso{width:100%;background:var(--papel);border:3px solid #E4C89A;border-radius:18px;padding:10px 12px;
  font-size:15px;font-weight:700;color:var(--tinta-suave);max-height:26vh;overflow:auto}
.repaso b{color:var(--tinta)}
.repaso ul{margin:6px 0 0;padding-left:20px}
.repaso li{margin:3px 0}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:#fff;border:3px solid var(--borde);border-radius:999px;padding:2px 12px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(12px,3.4vw,15px)}
.escena svg{min-width:0}
.escena.dos svg{max-height:178px;max-width:42vw}
.escena.mini svg{max-height:118px;max-width:23vw}
.escena.cinco svg{max-height:94px;max-width:18vw}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media (max-height:600px){.escena svg{max-height:150px}.btn{min-height:62px;padding:10px}.opciones.dos .btn{min-height:104px}}
</style>
</head>

let ctx = null, sonido = true;
try{ sonido = localStorage.getItem('vi_sonido') !== '0'; }catch(e){}

function audio(){
  try{
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
  }catch(e){ ctx = null; }
  return ctx;
}
function tono(freq, inicio, dur, forma, vol){
  const a = audio(); if(!a || !sonido) return;
  const t = a.currentTime + inicio;
  const o = a.createOscillator(), g = a.createGain();
  o.type = forma || 'triangle'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.22, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfxToque   = () => tono(660, 0, 0.10, 'sine', 0.16);
const sfxPasa    = () => { tono(523, 0, 0.10, 'sine', 0.16); tono(784, 0.07, 0.14, 'sine', 0.14); };
const sfxBien    = () => { [523,659,784,1047].forEach((f,k)=>tono(f, k*0.075, 0.28, 'triangle', 0.22)); };
const sfxMal     = () => { tono(330, 0, 0.16, 'sine', 0.18); tono(247, 0.14, 0.26, 'sine', 0.16); };
const sfxFiesta  = () => { [523,659,784,1047,784,1047,1319].forEach((f,k)=>tono(f, k*0.12, 0.34, 'triangle', 0.22)); };

let vozES = null;

  try{
    const v = window.speechSynthesis.getVoices() || [];
    vozES = v.find(x=>/^es[-_](MX|US|419|CO|AR|CL|PE)/i.test(x.lang))
         || v.find(x=>/^es/i.test(x.lang)) || null;
  }catch(e){}
}
try{ buscarVoz(); window.speechSynthesis.onvoiceschanged = buscarVoz; }catch(e){}

function hablar(texto){
  if(!sonido || !texto) return;
  try{
    const s = window.speechSynthesis; if(!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if(vozES){ u.voice = vozES; u.lang = vozES.lang; } else { u.lang = 'es-ES'; }
    u.rate = 0.92; u.pitch = 1.15; u.volume = 1;
    s.speak(u);
  }catch(e){}
}

/* ---------- confeti ---------- */
const cv = document.getElementById('confeti'), cx2d = cv.getContext('2d');
let trozos = [], animando = false;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function ajustarCanvas(){ cv.width = innerWidth; cv.height = innerHeight; }
ajustarCanvas(); addEventListener('resize', ajustarCanvas);
function confeti(cantidad){
  if(reduce) return;
  const colores = ['#FFC53D','#FF6B4A','#2F7FD4','#1E9E63','#8E5BD8','#FF8FA0'];
  for(let k=0;k<(cantidad||60);k++){
    trozos.push({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.3,
      vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.4, r:5+Math.random()*7,
      g:Math.random()*6, vg:(Math.random()-0.5)*0.3, c:colores[k%colores.length]});
  }
  if(!animando){ animando = true; requestAnimationFrame(pintarConfeti); }
}
function pintarConfeti(){
  cx2d.clearRect(0,0,cv.width,cv.height);
  trozos = trozos.filter(p=>p.y < cv.height + 30);
  trozos.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.g += p.vg;
    cx2d.save(); cx2d.translate(p.x,p.y); cx2d.rotate(p.g);
    cx2d.fillStyle = p.c; cx2d.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6); cx2d.restore();
  });
  if(trozos.length){ requestAnimationFrame(pintarConfeti); }
  else { animando = false; cx2d.clearRect(0,0,cv.width,cv.height); }
}

let examen = [], iPreg = 0, aciertos = 0, fallos = [], marcas = [];
function armarExamen(){
  const v = mezclar(ANIMALES.filter(a=>a.t==='v'));
  const i = mezclar(ANIMALES.filter(a=>a.t==='i'));
  const binarias = [v[0], i[0]].map(a=>({modo:'bin', a:a}));
  const clasifica = mezclar([v[1],v[2],v[3],i[1],i[2],i[3]]).map(a=>({modo:'grp', a:a}));
  const usados = {}; [v[0],i[0],v[1],v[2],v[3],i[1],i[2],i[3]].forEach(a=>{ usados[a.id]=1; });
  const conPatas = mezclar(ANIMALES.filter(a=>a.patas==='6'||a.patas==='8'||a.patas==='muchas'))
                    .filter(a=>!usados[a.id]).slice(0,2).map(a=>({modo:'patas', a:a}));
  return mezclar(binarias.concat(clasifica, conPatas));
}
function pantallaExamen(){
  examen = armarExamen(); iPreg = 0; aciertos = 0; fallos = []; marcas = [];
  mostrarPregunta();
}

    opciones = '<div class="opciones dos">'+
      '<button class="btn azul op" data-r="v">'+dibujo('hueso')+'<span>VERTEBRADO</span></button>'+
      '<button class="btn coral op" data-r="i">'+dibujo('blandito')+'<span>INVERTEBRADO</span></button>'+
      '</div>';
  } else if(p.modo === 'patas'){
    pregunta = '¿Cuántas patas tiene ' + a.n.charAt(0).toLowerCase() + a.n.slice(1) + '?';
    opciones = '<div class="opciones tres">' + PATAS_OPC.map(o =>
      '<button class="btn crema op" data-r="'+o.v+'">'+dibujo(o.ic)+'<span>'+o.txt+'</span></button>').join('') + '</div>';
  } else {
    const pool = (a.t === 'v' ? GRUPOS_V : GRUPOS_I).filter(g => g !== a.g);
    const tres = mezclar([a.g].concat(mezclar(pool).slice(0,2)));
    pregunta = '¿Qué es ' + a.n.charAt(0).toLowerCase() + a.n.slice(1) + '?';
    opciones = '<div class="opciones tres">' + tres.map(g =>
      '<button class="btn crema op" data-r="'+g+'">'+dibujo(ICONO_GRUPO[g])+'<span>'+g.toUpperCase()+'</span></button>').join('') + '</div>';
  }
  pintar(
   '<div class="marco">'+
     '<div class="barra"><button class="icono" id="btn-casa" aria-label="Volver al inicio">🏠</button>'+
       '<div class="estrellitas">'+estrellas+'</div>'+botonSonido()+'</div>'+
     '<div class="escena" id="escena" title="Tócame para escuchar otra vez">'+dibujo(a.id,'pop')+'<span class="oreja">🔊</span></div>'+
     '<h2 class="nombre">'+pregunta+'</h2>'+
     opciones+
   '</div>');
  engancharSonido(); engancharCasa(); escenaHabla(pregunta);
  hablar(pregunta);
  const botones = Array.prototype.slice.call(document.querySelectorAll('.op'));
  botones.forEach(b => { b.onclick = () => responder(b, botones, p); });
}
function responder(boton, botones, p){
  const a = p.a, t = sesion;
  const correcta = (p.modo === 'bin') ? a.t : (p.modo === 'patas' ? a.patas : a.g);
  const elegida = boton.getAttribute('data-r');
  const bien = (elegida === correcta);
  botones.forEach(b => { b.disabled = true; if(b !== boton) b.classList.add('apagado'); });
  const tipoTxt = a.t === 'v' ? 'vertebrado' : 'invertebrado';
  const patasTxt = a.patas === 'muchas' ? 'muchas patas' : (a.patas + ' patas');
  const etiqueta = (p.modo === 'bin') ? tipoTxt.toUpperCase()
                 : (p.modo === 'patas' ? patasTxt.toUpperCase() : correcta.toUpperCase());
  const explica = (p.modo === 'bin') ? (a.n + ' es un animal ' + tipoTxt + '. ' + a.d)
                 : (p.modo === 'patas' ? (a.n + ' tiene ' + patasTxt + ', por eso es un ' + a.g.toLowerCase() + '.')
                 : (a.n + ' es un ' + correcta.toLowerCase() + ', un animal ' + tipoTxt + '. ' + a.d));
  let voz;
  if(bien){
    aciertos++; marcas[iPreg] = true;
    boton.classList.remove('apagado'); boton.classList.add('bien');
    sfxBien(); confeti(34);
    voz = '¡Muy bien! ' + explica;
  } else {
    marcas[iPreg] = false;
    fallos.push({n:a.n, r:etiqueta, d:explica});
    boton.classList.remove('apagado'); boton.classList.add('mal');
    const buena = botones.filter(b => b.getAttribute('data-r') === correcta)[0];
    if(buena){ buena.classList.remove('apagado'); buena.classList.add('bien'); }
    sfxMal();
    voz = 'Casi. ' + explica;
  }
  decirYSeguir(voz, () => {
    if(t !== sesion) return;
    iPreg++;
    if(iPreg < examen.length) mostrarPregunta(); else pantallaResultado();
  });
}

/* ---------------- RESULTADO ---------------- */
function pantallaResultado(){
  sesion++; callar();
  let mejor = 0; try{ mejor = parseInt(localStorage.getItem('vi_mejor')||'0',10) || 0; }catch(e){}
  if(aciertos > mejor){ mejor = aciertos; try{ localStorage.setItem('vi_mejor', String(aciertos)); }catch(e){} }
  const estrellas = Math.round(aciertos / 2);
  let titulo, voz, cara;
  if(aciertos === 10){ titulo='¡PERFECTO, ANTONELA!'; cara='nina'; voz='¡Perfecto, Antonela! Diez de diez. ¡Estás lista para tu prueba!'; }
  else if(aciertos >= 8){ titulo='¡EXCELENTE!'; cara='nina'; voz='¡Excelente, Antonela! Sacaste '+aciertos+' de 10. ¡Casi perfecto!'; }
  else if(aciertos >= 6){ titulo='¡MUY BIEN!'; cara='columna'; voz='¡Muy bien! Sacaste '+aciertos+' de 10. Repasemos un poquito más.'; }
  else { titulo='¡A REPASAR JUNTOS!'; cara='blandito'; voz='Sacaste '+aciertos+' de 10. Vamos a repasar juntos y lo intentas otra vez.'; }
  if(aciertos >= 8){ sfxFiesta(); confeti(140); } else { sfxPasa(); }
  const repaso = fallos.length
    ? '<div class="repaso"><b>Para repasar:</b><ul>'+fallos.map(f=>'<li><b>'+f.r+'</b> — '+f.d+'</li>').join('')+'</ul></div>'
    : '<div class="repaso"><b>¡No te equivocaste en nada!</b> Recuerda: con huesos por dentro es <b>VERTEBRADO</b>, sin huesos por dentro es <b>INVERTEBRADO</b>.</div>';
  pintar(
   '<div class="marco">'+
     '<div class="barra"><button class="icono" id="btn-casa" aria-label="Volver al inicio">🏠</button>'+
       '<div class="pasos"></div>'+botonSonido()+'</div>'+
     '<div class="escena mini" id="escena">'+dibujo(cara,'pop')+'</div>'+
     '<div class="diploma">'+
       '<h2 class="nombre">'+titulo+'</h2>'+
       '<div class="marcador">'+aciertos+'<small>/10</small></div>'+
       '<div class="estrellas-fin">'+'⭐'.repeat(estrellas)+'</div>'+
     '</div>'+
     repaso+
     '<div class="tablero">'+
       '<button class="btn" id="b-otra">🔁<span>OTRA VEZ</span></button>'+
       '<button class="btn azul" id="b-repasar">📖<span>REPASAR</span></button>'+
     '</div>'+
   '</div>');
  engancharSonido(); engancharCasa(); escenaHabla(voz);
  hablar(voz);
  document.getElementById('b-otra').onclick    = () => { audio(); sfxPasa(); pantallaExamen(); };
  document.getElementById('b-repasar').onclick = () => { audio(); sfxPasa(); pantallaAprender(0); };
}

/* ---------------- arranque ---------------- */
document.addEventListener('pointerdown', function abrirAudio(){ audio(); document.removeEventListener('pointerdown', abrirAudio); });
pantallaInicio();
</script>
